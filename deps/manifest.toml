# ---------------------------------------------------------------- 构建产物
[[item]]
id = "initramfs"
what = "自制 initramfs（busybox + 内核模块 + 引导逻辑）"
check = "images/initramfs.cpio.gz"
how = "initramfs"
needs = ["busybox", "kernel", "arm64-rootfs"]
# 不校验哈希：它是本仓库的构建产物，改了 scripts/initramfs-init.sh 就会变