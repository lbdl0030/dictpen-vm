# x7 VM 适配：镜像的通用 asound.conf 把数字耳机（dhs_hwplug / tc_digital）
# 指到 plughw:2,0，但 VM 只有 card0（扬声器）和 card1（数字耳机），
# 打开 tc_digital 会报 "Invalid value for card"，应用放音点即停。
# 这里只把这两个别名改到 card1，其余逐字保持镜像原值。
# Sync from coco v1.0
# FIXME, RK eq_drc has been disabled now
defaults.pcm.rate_converter "speexrate_medium"
pcm.!default
{
    type asym
    playback.pcm "speaker" # no use ladspa path for eq_drc_process
    capture.pcm "hw:0,1"
}

# start for test resample >>>
pcm.soft_resample_spk {
    type rate
    slave {
        pcm "hw:1,0"
        rate 48000
    }
    # converter "samplerate" # or converter "speexrate" higher cpu loading
    converter "speexrate" # or converter "speexrate" lower cpu loading
}
# end for test resample <<<

# start for speaker playback >>>
pcm.speaker {
    type plug
    slave.pcm "spk_softvol"
}

pcm.spk_mono2stereo {
    type route
    slave {
        pcm "speaker"
        channels 2
    }
    ttable {
        0.0 1
        0.1 1
    }
}

pcm.spk_softvol {
    type softvol
    # slave.pcm "hooks_ply" # no use eq_drc_process
    # slave.pcm "hw:7,0,0" # using eq_drc_process for loopback
    # slave.pcm "hw:1,0"
    slave.pcm "plughw:1,0"
    # slave.pcm "soft_resample_spk" # using eq_drc_process for loopback
    # slave.pcm "rk_eqdrc" # using eq_drc_process for loopback 
    # slave.pcm "dmixer" # using eq_drc_process for loopback
    control {
        name "Master Playback Volume"
        card 1
        device 0
    }
    min_dB -46.08
    max_dB -0.18
    resolution 256
}
# end for speaker playback <<<

# start for digital headset >>>
pcm.dhs_mono2stereo {
    type route
    slave {
        pcm "hw:2,0"
        channels 2
    }
    ttable {
        0.0 1
        0.1 1
    }
}

pcm.dhs_other2stereo {
    type route
    slave {
        pcm "hw:2,0"
        channels 2
    }
    ttable {
        0.0 1
        1.1 1
    }
}

pcm.dhs_hwplug {
    type plug
    slave.pcm "plughw:1,0"
}

pcm.tc_digital {
    type plug
    slave.pcm "plughw:1,0"
}

# end for digital headset <<<

# start for analog playback >>>
pcm.tc_analog {
    type plug
    slave.pcm "hook_tca_ctrl"
}

pcm.tca_mono2stereo {
    type route
    slave {
        pcm "tc_analog"
        channels 2
    }
    ttable {
        0.0 1
        0.1 1
    }
}

pcm.tca_other2stereo {
    type route
    slave {
        pcm "tc_analog"
        channels 2
    }
    ttable {
        0.0 1
        1.1 1
    }
}

pcm.tca_softvol {
    type softvol
    slave.pcm "plughw:0,0"
    control {
        name "Master Playback Volume"
        card 0
        device 0
    }
    min_dB -46.08
    max_dB -0.18
    resolution 256
}

pcm.hook_tca_ctrl {
    type hooks
    slave.pcm "tca_softvol"
    hooks.0 {
        type ctl_elems
        hook_args [{
            name "Playback Path"
            preserve true
            value "HP"
            lock false
        }]
    }
}
# end for analog playback <<<

# start fot soft capture >>>
pcm.softvol_cap {
    type softvol
    slave.pcm "hw:0,1"
}
# end for soft capture <<<

# start for fake record >>>
pcm.fake_record {
    type plug
    slave.pcm "hw:7,1,0"
}
# end for fake record <<<

# start for fake playpath >>>
pcm.fake_play {
    type plug
    slave.pcm "plug:smart_pa" # with ladspa path for eq_drc_process
}
# end for fake playpath <<<

# for ana headset:fake_jack2 >>>
pcm.fake_jack2 {
    type plug
    slave.pcm "ana_phone"
}

pcm.hooks_ana_phone {
    type hooks
    slave.pcm "hw:0,0"
    hooks.0 {
        type ctl_elems
        hook_args [{
            name "Playback Path"
            preserve true
            value "HP"
            lock false
        }]
    }
}

pcm.softvol_ana_phone {
    type softvol
    slave.pcm "hooks_ana_phone"
    control {
        name "MasterAHP Volume"
        card 0
        device 0
    }
    min_dB -50.0
    max_dB 0.0
    resolution 100
}

pcm.ana_phone
{
    type plug
    slave {
        pcm "softvol_ana_phone"
        rate 48000
    }
}
# end for ana headset <<<
