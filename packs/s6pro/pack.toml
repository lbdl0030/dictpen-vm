[client]                            # 交给 vmgui 的机型 profile（vmgui/profiles/<名>.toml）
profile = ""

[checks]                            # 启动前校验（MD5 本地计算，用于自校验）
"images/S6-1-pro-ro-system_b.img" = { md5 = "6e3b2107e37be3dbccc203ac79cb0f33" }
"images/S6-1-pro-ro-boot_b.img"   = { md5 = "3f85a6da16fd0ec8a1afb67a5436f264" }
[state]
# 8 GiB（与 x7 一致）。容量只在创建状态盘时生效：改完要删掉旧的
# vm/state-s6pro.img（或 up --fresh），已有的盘不会自动扩。
size_mb = 8192
