# 固件包：s7pro —— 第二台异构机器（Cvitek CV1826 族，rootfs 只读 erofs）。
#
# 现状（2026-10-05）：**可跑** —— 引导、桌面 UI 上屏（1020x240 四卡片）、触摸、
# SSH/串口、假电量、持久化全部就绪。取证与逐条原因见本包 README.md。
#
# 与 a6pro/s6pro 的关键差异（对策都在 [adapt] 与 fixup.sh 里）：
#   * runtime 用 cv18xx-linux-erofs（rootfs 是 erofs；s6pro 是 ext4）；
#   * 板型 Y08_CV1813 由 [adapt.replace] 的 get_pcba_version.sh 报告；
#   * OCR 栈（libyocr/libYoudaoStitch）需要 CVITEK TPU，VM 没有 —— 用两份
#     桩化库替换，jsapi 加载链才不会断（断掉的表现是全黑 + 退回「验证引导」）；
#   * app 走 tslib（等 BTN_TOUCH），virtio-tablet 只发 BTN_LEFT —— 开框架的
#     touchbridge（uinput 桥）+ 本包 perl-tree；
#   * vendor dhcpcd 在 VM 内核上 SIGSYS 崩、eth0 不 UP —— fixup 装 S00net-up
#     用 busybox udhcpc 补位，否则 ssh/adb 全部悬空；
#   * runCapFrame 的启动点在 S01systeminit 且无 & 结尾 —— fixup 按 S* 通配静默，
#     否则 45 分钟写满 4GB 状态盘（实测）。

name    = "s7pro"
note    = "S7pro / Y08_CV1813（Cvitek CV1826）—— erofs rootfs，UI/触摸已验证"
version = ""

[platform]
soc     = "cv1826"
runtime = "cv18xx-linux-erofs"      # CV18xx 同族里 rootfs 为只读 erofs 的 backend
kernel  = ""
initrd  = ""

[image]
rootfs = "images/S7-1-pro-ro-system.img"
boot   = "images/S7-1-pro-ro-boot.img"

# 逻辑/虚拟屏 = 1020x240（横屏，与 UI 版式一致）。厂商 cfg.json 是 240/1020 +
# direction=270（面板竖扫 + 显示引擎旋转），cfg_overlay 把 width/height/direction
# 一起归一化成「1020x240 + direction=0」——理由与三条实测约束见 s6pro 包（同族同款
# app 行为）：app 走 fbdev，启动时按 cfg 的尺寸 FBIOPUT_VSCREENINFO，尺寸对不上
# 就直接退出。实测 vinfo 协商成功：`vinfo xres=1020 yres=240 bits_per_pixel=32`。
[display]
xres = 1020
yres = 240
rotation = 270

[audio]
# Y08_CV1813_V0 的 asound.conf：speaker=card1、数字耳机=card2。
# 只挂 2 块卡时数字耳机别名指向不存在的 card2，应用放音会 open 失败。
cards = 3
# 音量落在 card2：`/tmp/headSetStatus=1@@` 让 HAL 认为数字耳机插着，放音与音量都走
# digital_hs_card_id=2。控制台声音页按这一位读写 mixer，否则会"滑杆动了、值不动"。
volume_card = 2

[adapt]
battery     = true                  # hal-battery 读 /sys/class/power_supply（框架假电量）
license     = true                  # 开机写开发凭证
ap          = true                  # 2026-10-18 翻开（原 false"热点先不开"）：不开则「配置网络」永远搜不到 AP。代价见本包 README §11
touchbridge = "patches/touchbridge.pl"  # uinput 触摸桥（tslib 等 BTN_TOUCH；桥的
                                        # 面板尺寸读 cfg.json=1020x240，不用改脚本）
hooks       = ["patches/fixup.sh", "patches/vm-keys.sh"]  # 适配钩子 + 实体键三件套
                                    # 串口 shell、触摸节点别名、perl、arm64 工具
cfg_overlay = "patches/cfg.json.overrides"
extra       = ["patches/perl-tree",         # fixup 素材：Debian armhf perl（桥运行时）
               "patches/arm64-tree",         # fixup 素材：arm64 strace + dropbear
               "patches/vm-keys.pl", "patches/vm-keys-apply", "patches/vm-keys.env"]

[adapt.replace]
# 板型：固件原版读 /proc/device-tree/model，VM 里匹配不到任何分支
"patches/get_pcba_version.sh" = "/usr/bin/get_pcba_version"
# 应用启动脚本：删"每次清日志"与"崩溃 5 次 reboot"（其余与原版逐字一致）
"patches/runDictPen.sh"       = "/usr/bin/runDictPen"
# 32 位存储 shim（Q104）：覆盖 getStorageInfo，并跳过缺失的 NMT 本地翻译补丁；
# runDictPen.sh 会把它装成 /usr/bin/miniapp 的 LD_PRELOAD wrapper。
# 目标是新增文件，S00replace 只覆盖已存在的目标（[ -e "$dst" ]），所以这两行
# 只用于把文件带进 initrd；真正落盘由 fixup.sh 第 11 节直接拷进 $TARGET。
"patches/libvmstorage-armhf.so" = "/usr/lib/libvmstorage-armhf.so"
"patches/miniapp-wrapper.sh"    = "/usr/lib/miniapp-wrapper.sh"
# 应用侧两个空操作（源码同目录 appfix.c）：① 家长控制 WS 定时器桩，不桩它 app 每 16 s
# abort 一次（asio 定时器线程上抛出的 websocketpp 异常没人接）；② verifyLicense 恒真，
# 不然开机约 5 分钟后重校验失败（VM 没有 yd_misc_info 分区），前台被切到「开始激活」且退不回。
# 同上面两行，这一行只把文件带进 initrd，落盘由 fixup.sh 第 11 节做。取证与判据见
# README.md「崩溃循环」「激活页」两节与 docs/固件能力盘点.md §12.16、docs/疑难排查.md。
"patches/libvmappfix-armhf.so" = "/usr/lib/libvmappfix-armhf.so"
# OCR 栈桩化（fixup.sh 第 3 节有完整原因链）：真 libyocr 的 init 链要 CVITEK TPU
# （/dev/ion、/dev/cvi-tpu0），VM 没有；直接藏会让 dlopen("libyocr.so") 失败 →
# global/verify jsapi 断 → 全黑。桩 = 真库全导出改写（init/open/create 返回 -1、
# 其余 0，构造器中和），DT_NEEDED / 运行期 dlopen / 深层符号全部自然解析。
"patches/libyocr.so"          = "/oem/YoudaoDictPen/output/libs/libyocr.so"
"patches/libYoudaoStitch.so"  = "/oem/YoudaoDictPen/output/libs/libYoudaoStitch.so"

[checks]
"images/S7-1-pro-ro-system.img" = { md5 = "234e5d5f6a0be3bd36f8b75f44f9419a" }
"images/S7-1-pro-ro-boot.img"   = { md5 = "cd005817e4e6271e9ec74a605f01f06e" }

[state]
# 状态盘大小（MiB）：首启要装 preset 应用包，512M 装不下会表现为应用反复重启。
# 改大只在创建状态盘时生效（--fresh 或删盘）。
size_mb = 4096
