name = "x6pro"
note = "X6pro (RK3562 Melon) / Linux ext4 / OS 4.3.5 / 软件合成器 —— UI + 点 + 滑动 + 联网判定 + 首启已通（点/设备形态 DEVLOG §5.6(1)，滑动 §5.8，合成器守卫 §5.6(2)，联网 §5.7，首启 §5.10）"
version = "4.3.5"

[platform]
soc = "rk3562"
runtime = "rockchip-linux-ext4"
kernel = ""
initrd = ""

[image]
rootfs = "images/system_a.img"
boot = "images/boot_a.img"

[display]
xres = 960
yres = 480
rotation = 0
bpp = 32

[adapt]
battery = true
license = true
ap = true
touchbridge = "patches/touchbridge.pl"
cfg_overlay = "patches/cfg.json.overrides"
hooks = ["patches/prepare.sh"]
# Q99：preload shim + miniapp wrapper 要进 initrd，prepare.sh 才拿得到 /patches/*
extra = ["patches/libvmstorage.so", "patches/miniapp-wrapper.sh"]

[adapt.replace]
"patches/get_pcba_version" = "/usr/bin/get_pcba_version"
"patches/S50vm-ui" = "/etc/init.d/S50vm-ui"
"patches/S45vm-wifi" = "/etc/init.d/S45vm-wifi"
"patches/fake-keys.pl" = "/usr/bin/fake-keys.pl"
"patches/99-axs-ts.rules" = "/etc/udev/rules.d/99-axs-ts.rules"
"patches/weston.ini" = "/etc/xdg/weston/weston.ini"
"weston.tar" = "/userdata/weston.tar"
"desktop.tar" = "/userdata/desktop.tar"
"patches/libyocr.so" = "/oem/YoudaoDictPen/output/libs/libyocr.so"
"patches/libYoudaoStitch.so" = "/oem/YoudaoDictPen/output/libs/libYoudaoStitch.so"

[checks]
"images/boot_a.img" = "5a1129a5bd70cf3099b793e512aabb57"
"images/system_a.img" = "db313878a4a151e140d9be7cca287e5d"

[state]
# 状态盘（MiB）：overlay 的 upper 层就住在这块盘上，盘满会让 overlay 退化成只读、
# guest 的适配（S45vm-wifi / S50vm-ui / cfg 覆盖）随之全部失效。
# 本机首启要把 35 个预设包（165 MB 的 .amr → 223 MB 的 pkg 目录）装进 /userdisk，
# 实测装完即占 **318/488 MB（67%）**，默认 512 MiB 只剩 160 MB 余量（DEVLOG §5.10）。
# 加大只在创建时生效：`up --fresh`，或删掉 vm/state-x6pro.img 后再 `up`。
size_mb = 1024

[dist]
# 对外分发"可传播代码包"时要额外带上本包的开发记录。默认只带 pack.toml / README.md /
# cfg.json.overrides / touchbridge.pl 四项，而本包没有 README.md（说明全在同目录的
# DEVLOG.md 里），所以在这里声明它 —— 不必去改框架的 scripts/package.py。
include = ["DEVLOG.md"]